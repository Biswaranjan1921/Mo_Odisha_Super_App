version: '3.8'

services:
  # 1. POSTGRESQL DATABASE CONTAINER WITH POSTGIS SPATIAL EXTENSIONS
  postgres:
    image: postgis/postgis:15-3.3
    container_name: ssl-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ssl_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssl_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-state_smart_life}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ssl_admin} -d ${POSTGRES_DB:-state_smart_life}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

  # 2. REDIS DISTRIBUTED IN-MEMORY CACHE (WITH AUTHENTICATION)
  redis:
    image: redis:7.0-alpine
    container_name: ssl-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-ssl_redis_pass_2026}
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ssl_redis_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 3. SPRING BOOT APPLICATION CONTAINER
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ssl-backend-app
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-state_smart_life}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ssl_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ssl_secure_pass_2026}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-ssl_redis_pass_2026}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      APP_JWT_SECRET: ${JWT_SECRET:-407f3f619e917d23d8c835a6104ab08cfb27429188e7f80ad22a0e2849be54c5}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G

  # 4. REACT VITE FRONTEND CONTAINER (NGINX WEB SERVER)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ssl-frontend-web
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
