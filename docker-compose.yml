version: '3.8'

services:
  # 1. POSTGRESQL DATABASE CONTAINER WITH POSTGIS SPATIAL EXTENSIONS
  postgres:
    image: postgis/postgis:15-3.3
    container_name: ssl-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ssl_admin
      POSTGRES_PASSWORD: ssl_secure_pass_2026
      POSTGRES_DB: state_smart_life
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-run our schema script on container initialization
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssl_admin -d state_smart_life"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. REDIS DISTRIBUTED IN-MEMORY CACHE
  redis:
    image: redis:7.0-alpine
    container_name: ssl-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. SPRING BOOT APPLICATION CONTAINER
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ssl-backend-app
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/state_smart_life
      SPRING_DATASOURCE_USERNAME: ssl_admin
      SPRING_DATASOURCE_PASSWORD: ssl_secure_pass_2026
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: dev
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
