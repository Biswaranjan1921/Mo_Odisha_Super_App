# =========================================================================
# STATE SMART LIFE - DEVELOPMENT PROFILE CONFIGURATION (DEV)
# =========================================================================

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:state_smart_life;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:50} # Optimized connection pool size for 50 VU concurrency
      minimum-idle: ${HIKARI_MIN_IDLE:20}
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update # Dev auto-sync; overridden by Flyway in Part 2
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 60000ms

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  auth:
    email-verification-expiration-ms: 86400000 # 24 Hours
    base-url: http://localhost:5173

management:
  health:
    db:
      enabled: false # Disabled for Part 1 baseline verification; re-enabled in Part 2 after DB setup
    redis:
      enabled: false # Disabled for Part 1 baseline verification; re-enabled in Part 17 after Redis setup

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    com.statesmartlife: DEBUG
