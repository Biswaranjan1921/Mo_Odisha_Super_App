# =========================================================================
# STATE SMART LIFE - CENTRAL CONFIGURATION REGISTRY
# =========================================================================

spring:
  application:
    name: state-smart-life
  
  # Database Connections
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/state_smart_life}
    username: ${SPRING_DATASOURCE_USERNAME:ssl_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:ssl_secure_pass_2026}
    driver-class-name: org.postgresql.Driver
  
  # JPA & Hibernate Settings
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # Automatically sync schema in dev, change to 'validate' or 'none' in production
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  # Redis Configuration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 60000ms

server:
  port: 8081
  servlet:
    context-path: /api/v1

# Security and Cryptography Details
app:
  jwt:
    # 256-bit Hex Key (Minimum strength requirement)
    secret: 407f3f619e917d23d8c835a6104ab08cfb27429188e7f80ad22a0e2849be54c5
    expiration-ms: 900000 # 15 Minutes
    refresh-expiration-ms: 2592000000 # 30 Days

# Logging Layouts
logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    com.statesmartlife: DEBUG
