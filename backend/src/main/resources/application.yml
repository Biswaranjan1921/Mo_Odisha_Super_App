# =========================================================================
# STATE SMART LIFE - MASTER CONFIGURATION REGISTRY
# =========================================================================

spring:
  application:
    name: state-smart-life
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${APP_JWT_SECRET:407f3f619e917d23d8c835a6104ab08cfb27429188e7f80ad22a0e2849be54c5}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:900000} # 15 Minutes
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:2592000000} # 30 Days
